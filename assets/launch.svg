<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Jon Snyder. A rocket lifts off from its pad and arcs into orbit.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03040b"/>
      <stop offset="0.65" stop-color="#0a1028"/>
      <stop offset="1" stop-color="#16224d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.75">
      <stop offset="0" stop-color="#4f7dff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4f7dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffd7a1" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="flame" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="0.35" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff4d1a" stop-opacity="0"/>
    </linearGradient>
    <style>
      .star { fill: #fff; animation: twinkle 3s ease-in-out infinite; }
      .s2 { animation-delay: .7s; } .s3 { animation-delay: 1.4s; } .s4 { animation-delay: 2.1s; }
      @keyframes twinkle { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
      .flicker { transform-origin: -34px 0; animation: flicker .12s ease-in-out infinite alternate; }
      @keyframes flicker { from { transform: scaleX(.8); } to { transform: scaleX(1.15); } }
      .name { font: 800 54px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 6px; fill: #f5f7ff; }
      .role { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2.5px; fill: #8fb0ff; }
      .tele { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1.5px; fill: #6b7aa6; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1000" height="300" fill="url(#sky)"/>

  <!-- starfield -->
  <g>
    <circle class="star" cx="40" cy="30" r="1.2"/><circle class="star s2" cx="120" cy="80" r="0.9"/>
    <circle class="star s3" cx="210" cy="22" r="1.4"/><circle class="star s4" cx="300" cy="60" r="0.8"/>
    <circle class="star" cx="380" cy="18" r="1"/><circle class="star s3" cx="460" cy="95" r="1.1"/>
    <circle class="star s2" cx="540" cy="40" r="0.9"/><circle class="star s4" cx="610" cy="14" r="1.3"/>
    <circle class="star" cx="680" cy="70" r="0.8"/><circle class="star s2" cx="745" cy="28" r="1.1"/>
    <circle class="star s3" cx="820" cy="55" r="1.4"/><circle class="star s4" cx="900" cy="20" r="0.9"/>
    <circle class="star" cx="960" cy="85" r="1.2"/><circle class="star s3" cx="860" cy="120" r="0.8"/>
    <circle class="star s2" cx="70" cy="140" r="0.9"/><circle class="star s4" cx="500" cy="150" r="0.7"/>
    <circle class="star" cx="640" cy="125" r="1"/><circle class="star s2" cx="250" cy="130" r="0.8"/>
    <circle class="star s3" cx="985" cy="160" r="1"/><circle class="star s4" cx="15" cy="200" r="0.8"/>
  </g>

  <!-- horizon -->
  <rect y="150" width="1000" height="150" fill="url(#glow)"/>
  <path d="M0 300 Q500 232 1000 300 Z" fill="#05070f"/>
  <path d="M0 300 Q500 232 1000 300" fill="none" stroke="#5d8bff" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- launch pad -->
  <g transform="translate(890 262)">
    <rect x="-26" y="0" width="52" height="5" fill="#2a3358"/>
    <rect x="16" y="-62" width="5" height="62" fill="#2a3358"/>
    <path d="M16 -50 H8 M16 -34 H8 M16 -18 H8" stroke="#2a3358" stroke-width="2"/>
  </g>

  <!-- exhaust trail, drawn in step with the rocket -->
  <path d="M890 228 C 890 150, 910 80, 1070 -40" fill="none" stroke="url(#trail)" stroke-width="3" stroke-linecap="round"
        pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;0.15;0.75;1" calcMode="spline"
             keySplines="0 0 1 1; 0.55 0 0.9 0.55; 0 0 1 1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;0" keyTimes="0;0.15;0.8;1" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- rocket: drawn nose-right so rotate="auto" points it along the trajectory -->
  <g>
    <g>
      <g class="flicker">
        <path d="M-34 -5 L-78 0 L-34 5 Z" fill="url(#flame)"/>
      </g>
      <path d="M-34 -6 H22 Q40 -6 46 0 Q40 6 22 6 H-34 Z" fill="#eef2ff"/>
      <rect x="-34" y="-6" width="10" height="12" fill="#1c2340"/>
      <rect x="8" y="-6" width="4" height="12" fill="#1c2340"/>
      <path d="M-34 -6 L-42 -13 L-26 -6 Z M-34 6 L-42 13 L-26 6 Z" fill="#c9d3f5"/>
    </g>
    <animateMotion path="M890 228 C 890 150, 910 80, 1070 -40" rotate="auto" keyPoints="0;0;1;1" keyTimes="0;0.15;0.75;1"
                   calcMode="spline" keySplines="0 0 1 1; 0.55 0 0.9 0.55; 0 0 1 1" dur="7s" repeatCount="indefinite"/>
  </g>

  <!-- name plate -->
  <text x="56" y="128" class="name">JON SNYDER</text>
  <text x="58" y="164" class="role">FULL-STACK ENGINEER  //  FOUNDER, FACTIII</text>
  <text x="58" y="198" class="tele">&gt; web · mobile · backend · infra — designed, built and run end to end<tspan class="cursor"> _</tspan></text>
</svg>
